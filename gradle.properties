org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Toolchain (Minecraft 26.3 runs on Java 25; the game jar is compiled for 25)
java_version=25

# Fabric — 26.3 ships an *unobfuscated* client jar, so Loom runs without mappings
# and dependencies are plain `implementation` instead of `modImplementation`.
minecraft_version=26.3
loader_version=0.20.1
fabric_api_version=0.165.2+26.3
loom_version=1.19.4

# Kotlin (matches fabric-language-kotlin-1.14.2+kotlin.2.4.21)
kotlin_version=2.4.21
fabric_kotlin_version=1.14.2+kotlin.2.4.21

# YACL (matches yet_another_config_lib_v3-3.9.7+26.3-fabric)
yacl_version=3.9.7+26.3-fabric

systemProp.http.proxyHost=
systemProp.https.proxyHost=
